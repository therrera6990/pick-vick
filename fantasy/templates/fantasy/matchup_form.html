{% extends "fantasy/base.html" %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="card shadow-sm">
            <div class="card-body">

                <h1 class="mb-4">
                    Create Matchup
                </h1>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary">
                            Create Matchup
                        </button>

                        <a
                            href="{% url 'matchup_list' %}"
                            class="btn btn-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

</div>

{% endblock %}
