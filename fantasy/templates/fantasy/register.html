{% extends "fantasy/base.html" %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h1 class="mb-4">Create Account</h1>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-primary">
                    Register
                </button>
            </form>

        </div>
    </div>
</div>

{% endblock %}
