{% extends "fantasy/base.html" %}

{% block content %}

<div class="container py-5">

    <h1>Drop Player</h1>

    <p>
        Are you sure you want to drop
        <strong>{{ roster_entry.player.name }}</strong>
        from
        <strong>{{ team.team_name }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button
            type="submit"
            class="btn btn-danger">
            Drop Player
        </button>

        <a
            href="{% url 'team_roster' team.id %}"
            class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
