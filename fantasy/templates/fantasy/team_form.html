{% extends "fantasy/base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <h1 class="mb-4">
                {{ page_title }}
            </h1>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-primary">
                    Save Team
                </button>

                <a
                    href="{% url 'team_list' %}"
                    class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
