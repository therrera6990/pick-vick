<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pick Vick</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            Pick Vick
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="mainNavbar">

            <div class="navbar-nav me-auto">

                <a
                    class="nav-link"
                    href="/">
                    Home
                </a>

                <a
                    class="nav-link"
                    href="{% url 'team_list' %}">
                    Teams
                </a>

                <a
                    class="nav-link"
                    href="{% url 'player_list' %}">
                    Players
                </a>

                <a
                    class="nav-link"
                    href="{% url 'matchup_list' %}">
                    Matchups
                </a>

                <a
                    class="nav-link"
                    href="{% url 'standings' %}">
                    Standings
                </a>

                <a
                    class="nav-link"
                    href="{% url 'transaction_list' %}">
                    Transactions
                </a>

            </div>

            <div class="navbar-nav align-items-lg-center">

                {% if user.is_authenticated %}

                    <span class="navbar-text me-lg-3">
                        Hello, {{ user.username }}
                    </span>

                    <form
                        method="post"
                        action="{% url 'logout' %}">
                        {% csrf_token %}

                        <button
                            class="btn btn-outline-light mt-2 mt-lg-0"
                            type="submit">
                            Logout
                        </button>
                    </form>

                {% else %}

                    <a
                        class="nav-link"
                        href="{% url 'login' %}">
                        Login
                    </a>

                    <a
                        class="nav-link"
                        href="{% url 'register' %}">
                        Register
                    </a>

                {% endif %}

            </div>

        </div>

    </div>
</nav>

<main>
{% block content %}
{% endblock %}
</main>

<footer class="bg-dark text-light text-center py-3 mt-5">
    <div class="container">
        <p class="mb-0">
            Pick Vick | CS 408 | Fall 2026
        </p>

    </div>
</footer>
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
